<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 1_homework</title>

    <style>
      div {
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      .currently {
        font-size: 32px;
      }

      .emojiclass1 {
        font-size: 30px;
      }

      h1 {
        color: #1a64d6;
        font-size: 30px;
        padding: 0px auto;
        margin: 15px auto 5px;
      }

      h3 {
        padding-top: 30px;
      }

      .tomorrow {
        width: 400px;
        height: 150px;
        position: absolute;
        top: 150px;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 0 auto;
      }

      .tomorrow:hover {
        background-color: #fffbef;
        transition: all 200ms ease-in-out;
        border-radius: 15px;
        justify-content: center;
      }

      .tomorrow-temperature {
        display: inline-block;
        font-family: monospace;
        font-size: 15px;
        padding-bottom: 40px;
      }

      .saturday {
        width: 400px;
        height: 150px;
        position: absolute;
        top: 300px;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 0 auto;
      }

      .saturday:hover {
        background-color: #fffbef;
        transition: all 200ms ease-in-out;
        border-radius: 15px;
        justify-content: center;
      }

      .saturday-temperature {
        display: inline-block;
        font-family: monospace;
        font-size: 15px;
        padding-bottom: 30px;
      }

      .sunday {
        width: 400px;
        height: 150px;
        position: absolute;
        top: 450px;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 0 auto;
      }

      .sunday:hover {
        background-color: #fffbef;
        transition: all 200ms ease-in-out;
        border-radius: 15px;
        justify-content: center;
      }

      .sunday-temperature {
        display: inline-block;
        font-family: monospace;
        font-size: 15px;
        padding-bottom: 30px;
      }

      button {
        color: white;
        display: block;
        margin: 0 auto 20px auto;
        padding: 15px 20px 15px 20px;
        background-color: #1a64d6;
        border-color: #1a64d6;
        font-size: 18px;
        border-radius: 50px;
        box-shadow: 5px 5px 10px rgba (0, 0, 0, 0.3);
        transition: all 200ms ease-in-out;
        position: absolute;
        top: 630px;
        bottom: 0;
        left: 0;
        right: 0;
        width: 150px;
        height: 50px;
      }

      .change-city:hover {
        background-color: white;
        border-color: #1a64d6;
        color: #1a64d6;
        cursor: pointer;
      }

      p {
        font-family: monospace;
        text-align: center;
        position: absolute;
        top: 680px;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <span class="emojiclass1"> ⛅ </span><br />
      <h1>Currently 21° in Tokyo</h1>
    </div>
    <div class="currently">13° / <strong> 23°</strong></div>
    <br />
    <div class="tomorrow">
      <h3>🌧️ Tomorrow</h3>
      <span class="tomorrow-temperature"> 10° / <strong>22°</strong></span>
    </div>
    <br />
    <div class="saturday">
      <h3>🌥️ Saturday</h3>
      <span class="saturday-temperature"> 15° / <strong>17°</strong></span>
    </div>
    <br />
    <div class="sunday">
      <h3>☀️ Sunday</h3>
      <span class="sunday-temperature"> 25° / <strong>28°</strong></span>
    </div>
    <br />
    <br />
    <button class="change-city">Change city</button>

    <p>Coded by Jessica Wessels</p>
  </body>
</html>
